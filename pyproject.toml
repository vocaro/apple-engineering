[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocaro-engineering"
version = "0.1.0"
description = "Shared Apple engineering tools and maintained technical knowledge"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
eng = "vocaro_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src/python"]
